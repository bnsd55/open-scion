# The measured recovery time of docs/operations.md, section 7: a store
# of a stated size, a server killed with SIGKILL mid-land, the time from
# the restart until readiness answers SERVING and the first read
# succeeds. The runner label is the machine class the docs quote; this
# fixed image is the only machine the number comes from.
#
# No pull_request trigger on purpose, for the same reason as
# restore-bench: a recovery time does not need to run per PR, and an
# edit to this file is not a workflow-lane PR that every open PR must
# merge.

name: recovery-bench
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  recovery:
    name: recovery time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p open-scion-server --test recovery_bench -- --ignored --nocapture
