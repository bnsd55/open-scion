name: fuzz

on:
  schedule:
    # Nightly, after the soak: every target gets its named budget, and the
    # corpus it grew carries into the next night through the cache.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      # Every budget of the matrix is multiplied by this: 12 turns the
      # 300 s targets into one hour. The default is the nightly budget.
      budget_scale:
        description: multiply every target's budget by this
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This file has no pull_request trigger, so the expression always
  # reads false: a dispatch cannot cancel the nightly in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    name: fuzz ${{ matrix.crate }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # The ceiling, not the budget: a one-hour campaign needs the build
    # time too, and the nightly's minutes fit well inside it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The wire and client-door decoders get the long budgets; the
          # small validators get the short ones.
          - { crate: scion-core, target: decode, budget: 300 }
          - { crate: scion-core, target: repo-path, budget: 120 }
          - { crate: scion-proto, target: object, budget: 300 }
          - { crate: scion-proto, target: ticket, budget: 120 }
          - { crate: scion-proto, target: check-name, budget: 120 }
          - { crate: scion-proto, target: request-id, budget: 120 }
          - { crate: scion-server, target: write-decode, budget: 300 }
          - { crate: scion-server, target: blame-cursor, budget: 300 }
          - { crate: scion-server, target: access, budget: 120 }
          - { crate: scion-server, target: archive-verify, budget: 300 }
          - { crate: scion-server, target: archive-read, budget: 300 }
          - { crate: scion-tier, target: snapshot-seed, budget: 300 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz
      - name: restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-
      - name: fuzz ${{ matrix.target }} for ${{ matrix.budget }} s
        run: |
          # The prebuilt cargo-fuzz defaults to a musl target, where the
          # address sanitizer cannot run (ci.yml's smoke notes this too).
          # Everything is crate-relative: the corpus, the seeds, and the
          # build all live under this crate's fuzz directory.
          cd "crates/${{ matrix.crate }}"
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          seeds=""
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            seeds="fuzz/seeds/${{ matrix.target }}"
          fi
          cargo fuzz run \
            --target x86_64-unknown-linux-gnu "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" $seeds \
            -- -max_total_time=$(( ${{ matrix.budget }} * ${{ inputs.budget_scale || 1 }} ))
      - name: upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: ignore
