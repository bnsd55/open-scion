name: pg disk full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (postgres disk full)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
          # The WAL off the small tmpfs: a heap extend then fails with
          # the clean 53100, and a WAL write never hits ENOSPC.
          POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw,size=268435456
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the tests
        run: cargo test -p open-scion-server --test disk_full
        env:
          SCION_DISK_REQUIRE: "1"
          SCION_PG_TMPFS_BYTES: "268435456"
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
