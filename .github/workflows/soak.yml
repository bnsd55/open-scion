name: soak
on:
  schedule:
    # Once a day, at 02:30 UTC. The nightly soak runs 120 minutes: long
    # enough for the latency trend's thirds to mean something, bounded so
    # a hung client cannot hold the runner past the job's own timeout.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: run length in minutes
        # A dispatch is the bounded manual run; the nightly schedule runs
        # 120 regardless of this default.
        default: "10"

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

jobs:
  soak:
    name: soak
    runs-on: ubuntu-24.04
    # The load runs 120 minutes and the step cap on it is 150; the build,
    # the checks and the teardown share the rest of the job's 165 minutes.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: run the soak
        env:
          # The nightly schedule runs 120 minutes; a dispatch names its
          # own length, 10 by default. The input goes through env:, not
          # through the run: string, so no shell sees it unquoted.
          RUN_MINUTES: ${{ github.event.inputs.minutes || '120' }}
          # The resource ceilings, each named here and enforced by
          # scripts/soak.sh: a server may grow to
          SOAK_RSS_PCT: "150" # 150 percent of its warm RSS,
          SOAK_FD_GROWTH: "100" # 100 open files over its start, steady,
          SOAK_P99_FACTOR: "2" # and its late p99 must stay under 2x its early p99.
          # The RSS warm-up window: the bound's baseline is the first
          # sample after 1800 s (30 min), because the server's memory
          # climbs while its caches and arenas fill - one 35-minute run
          # saw about 30 minutes of it - and a baseline at the start made
          # every longer warm-up a false red. The nightly still checks
          # 90 minutes of RSS after it. A run shorter than the window
          # checks no RSS bound: it cannot tell warm-up from a leak.
          SOAK_WARM_SECONDS: "1800"
        run: |
          # The soak's own cap: 150 min covers the 120 min of load, and
          # the build, the checks and the teardown live in the job's
          # remaining 15. (9000 s = 150 min.)
          timeout 9000 scripts/soak.sh
      # The bounds live in the script; a failed bound fails the step and
      # keeps the CSVs and logs.
      - name: upload the samples and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-artifacts
          path: ${{ runner.temp }}/soak-artifacts/
          if-no-files-found: ignore

  # The fault half of the soak (issue #239, part 3): the same mixed
  # load, with the server killed and restarted on schedule, so the
  # nightly sees what a 72-hour run would. It runs beside the soak, not
  # after it, so one failing never skips the other. The kill schedule
  # and the checks live in scripts/soak-fault.sh; the ceilings reuse
  # soak's env names, and SOAK_WARM_SECONDS is the baseline window that
  # soak's RSS bound moves to (#365), applied per restart segment.
  soak-fault:
    name: soak-fault
    runs-on: ubuntu-24.04
    # The same shape as the soak: 150 min covers 120 min of load, and
    # the build, the checks and the teardown share the rest.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: run the fault soak
        env:
          RUN_MINUTES: ${{ github.event.inputs.minutes || '120' }}
          SOAK_RSS_PCT: "150" # 150 percent of the segment's warm RSS,
          SOAK_FD_GROWTH: "100" # 100 open files over the segment's start,
          SOAK_P99_FACTOR: "2" # and the late p99 under 2x the early p99.
          # The RSS baseline window, the same name and rule soak.yml
          # passes to soak.sh (#365): the baseline is the first sample
          # after it, per restart segment.
          SOAK_WARM_SECONDS: "1800"
        run: |
          # The same cap as the soak: 150 min covers 120 min of load.
          timeout 9000 scripts/soak-fault.sh
      - name: upload the samples and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-fault-artifacts
          path: ${{ runner.temp }}/soak-fault-artifacts/
          if-no-files-found: ignore

  # The Postgres arm of the fault soak: the same mixed load, kills and
  # checks, on a Postgres-backed store, with the database itself
  # restarted beside every server kill (SCION_FAULT_PG, soak-fault.sh's
  # pg_restart). Dispatch only: where a long-run Postgres lives is
  # still open (D10), so the nightly never runs this arm; a dispatch
  # proves it on demand. The image is pinned tag@sha256 the way the
  # digest-pin wave (C64) pins the service containers.
  soak-fault-postgres:
    name: soak-fault-postgres
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The same shape as the SQLite fault soak: 150 min covers 120 min
    # of load, and the build, the checks and the teardown share the
    # rest. A dispatch defaults to 10 minutes of load.
    timeout-minutes: 165
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: run the fault soak on Postgres
        env:
          RUN_MINUTES: ${{ github.event.inputs.minutes || '120' }}
          SOAK_RSS_PCT: "150"
          SOAK_FD_GROWTH: "100"
          SOAK_P99_FACTOR: "2"
          # The same baseline window as the SQLite fault soak (#365),
          # applied per restart segment.
          SOAK_WARM_SECONDS: "1800"
          # The backend and its fault: the URL decides the store's
          # backend (soak-fault.sh exports it as SCION_POSTGRES_URL),
          # and the restart command restarts this job's own service
          # container, the only postgres image on the runner.
          SCION_PG_URL: postgres://postgres:scion@localhost:5432/scion
          SCION_FAULT_PG: "1"
          SCION_FAULT_PG_CMD: docker restart ${{ job.services.postgres.id }}
          # soak-fault.sh's restart wait runs bare `pg_isready`, whose
          # default host is the local socket; on the runner Postgres is
          # the service container's TCP port, so libpq looks there.
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
        run: |
          # The same cap as the SQLite fault soak: 150 min covers 120
          # min of load.
          timeout 9000 scripts/soak-fault.sh
      - name: upload the samples and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-fault-postgres-artifacts
          path: ${{ runner.temp }}/soak-fault-artifacts/
          if-no-files-found: ignore
