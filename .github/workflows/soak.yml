name: soak
on:
  schedule:
    # Once a day, at 02:30 UTC. The nightly soak runs 120 minutes: long
    # enough for the latency trend's thirds to mean something, bounded so
    # a hung client cannot hold the runner past the job's own timeout.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: run length in minutes
        # A dispatch is the bounded manual run; the nightly schedule runs
        # 120 regardless of this default.
        default: "10"

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
jobs:
  soak:
    name: soak
    runs-on: ubuntu-24.04
    # The load runs 120 minutes and the step cap on it is 150; the build,
    # the checks and the teardown share the rest of the job's 165 minutes.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: run the soak
        env:
          # The nightly schedule runs 120 minutes; a dispatch names its
          # own length, 10 by default. The input goes through env:, not
          # through the run: string, so no shell sees it unquoted.
          RUN_MINUTES: ${{ github.event.inputs.minutes || '120' }}
          # The resource ceilings, each named here and enforced by
          # scripts/soak.sh: a server may grow to
          SOAK_RSS_PCT: "150" # 150 percent of its warm RSS,
          SOAK_FD_GROWTH: "100" # 100 open files over its start, steady,
          SOAK_P99_FACTOR: "2" # and its late p99 must stay under 2x its early p99.
          # The RSS warm-up window: the bound's baseline is the first
          # sample after 1800 s (30 min), because the server's memory
          # climbs while its caches and arenas fill - one 35-minute run
          # saw about 30 minutes of it - and a baseline at the start made
          # every longer warm-up a false red. The nightly still checks
          # 90 minutes of RSS after it. A run shorter than the window
          # checks no RSS bound: it cannot tell warm-up from a leak.
          SOAK_WARM_SECONDS: "1800"
        run: |
          # The soak's own cap: 150 min covers the 120 min of load, and
          # the build, the checks and the teardown live in the job's
          # remaining 15. (9000 s = 150 min.)
          timeout 9000 scripts/soak.sh
      # The bounds live in the script; a failed bound fails the step and
      # keeps the CSVs and logs.
      - name: upload the samples and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-artifacts
          path: ${{ runner.temp }}/soak-artifacts/
          if-no-files-found: ignore
