name: soak
on:
  schedule:
    # 02:30 UTC daily, outside the working hours of every coder.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: run length in minutes
        default: "10"

jobs:
  soak:
    name: soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - name: run the soak
        run: RUN_MINUTES=${{ github.event.inputs.minutes || '10' }} timeout 2400 scripts/soak.sh
      # The bounds live in the script; a failed bound fails the step and
      # keeps the CSVs and logs.
      - name: upload the samples and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts
          path: ${{ runner.temp }}/soak-artifacts/
          if-no-files-found: ignore
