name: scorecard
on:
  push:
    # Only the default branch is supported by the action.
    branches: [main]
  schedule:
    # Weekly, Saturdays 04:30 UTC — off the soak (daily 02:30) and the
    # CodeQL slot (Monday 03:07), so no two heavy scans queue together.
    - cron: "30 4 * * 6"

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The two writes the docs name for this job: the SARIF upload to
      # code scanning, and the OIDC token that publishes the public
      # result when publish_results is true. The reads are the default
      # contents: read plus actions: read for the workflow-run checks.
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      # persist-credentials: false: the analysis needs no token after
      # checkout, so the job leaves none behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run the Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the run: the public REST API (and any badge) gets
          # its score from this run, and the Scorecard team's weekly
          # public scan can reuse it instead of re-running the checks.
          publish_results: true
      # A second pass in Scorecard's JSON results format, so the policy
      # check sees EVERY check with its score: the SARIF reports only
      # checks with findings, and a skipped or errored check must fail
      # the policy, not hide behind a missing entry. The action's docs
      # list the supported formats: "The format in which to store the
      # results [json | sarif | intoto]".
      - name: run the Scorecard analysis again, as JSON for the policy
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          # Published once, above; a second publish is refused.
          publish_results: false
      - name: upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
      - name: enforce the pinned policy
        run: python3 scripts/check-scorecard-policy.py results.json
          .github/scorecard-policy.yml
