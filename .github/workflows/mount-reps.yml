name: mount-reps

# Evidence that the fork gate (#309) fixed the macOS mount flake: the
# original flake was a race between a mount test and ANOTHER forking
# test running in parallel, because a fork copies the process's open
# serve.lock files to the child until it execs, and macOS is slow to
# exec. The gate's users live in two modules, so the run takes both
# filters (libtest ORs them): cmd::mount is the flaked test's module
# and cmd::commit holds the other forking, serve-lock-reading test.
# The tests run at cargo's default thread count, so the parallel forks
# of the original race are all in the room. On a dispatch this
# workflow builds the test binary once and repeats the two modules'
# tests the number of times the reps input gives, on the same fixed
# macos-15 image CI's test job uses, and stops at the first failure
# and uploads that run's log. Runs only when a person asks: never on
# pushes or pull requests.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: how many times to run the scn mount tests
        default: "100"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
jobs:
  mount-reps:
    name: mount tests x reps
    runs-on: macos-15
    # One rep of the two filters took 0.15 s on a local Mac (five reps
    # in 0.75 s), so 100 reps stay under half a minute even at a
    # runner's slower pace; the one-time build of the lib test binary is
    # the bulk of the job (CI's whole-workspace macOS test job, cache
    # warm, runs about 12 minutes). The cap is that build plus the reps
    # with a wide margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build the scn test binary once
        # No filter here: cargo takes one positional TESTNAME, and with
        # --lib the one binary holds every lib test anyway. The two
        # filters select at run time, in the step below.
        run: |
          cargo test -p open-scion --lib --no-run \
            --message-format=json > "$RUNNER_TEMP/build.json"
          bin=$(jq -r 'select(.executable != null and .profile.test == true
                and .target.kind[0] == "lib") | .executable' \
                "$RUNNER_TEMP/build.json")
          test -n "$bin" || { echo "the lib test binary did not build"; exit 1; }
          echo "bin=$bin" >> "$GITHUB_ENV"
      - name: run the mount tests, one rep at a time
        env:
          # The input goes through env:, not through the run: string, so
          # no shell sees it unquoted (as soak.yml does). An API dispatch
          # with an empty reps falls back to the same 100 the input
          # defaults to.
          REPS: ${{ github.event.inputs.reps || '100' }}
        run: |
          case "$REPS" in ''|*[!0-9]*|0)
            echo "reps must be a positive number, got: $REPS"; exit 1;; esac
          i=0
          while [ "$i" -lt "$REPS" ]; do
            i=$((i + 1))
            log="$RUNNER_TEMP/mount-rep-$i.log"
            # macOS has no coreutils timeout on this image, and perl is
            # on every one: alarm survives exec, so this bounds each rep
            # the way the nfs-mount job's `timeout` bounds its script.
            if ! perl -e 'alarm shift; exec @ARGV' 300 \
                 "$bin" cmd::mount cmd::commit >"$log" 2>&1; then
              echo "run $i of $REPS failed; the log is in the artifact"
              tail -80 "$log"
              exit 1
            fi
            # A filter that matches nothing also passes in 0.15 s, so
            # each green rep must prove the race ran at all: the flaky
            # test itself passed, and the pass count reached the floor
            # the two filters matched when measured (18: 15 in
            # cmd::mount, 3 in cmd::commit; raise the floor if the
            # suites grow).
            grep -qF 'test cmd::mount::silent_failures::an_unmount_does_not_signal_an_unrelated_process ... ok' "$log" || {
              echo "run $i: the filters ran too few tests: the flaky test is absent"; tail -5 "$log"; exit 1
            }
            passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed.*/\1/p' "$log" | head -1)
            if [ -z "$passed" ] || [ "$passed" -lt 18 ]; then
              echo "run $i: the filters ran too few tests ($passed passed, floor 18)"
              tail -5 "$log"
              exit 1
            fi
            echo "run $i/$REPS ok"
          done
      - name: upload the failing run's log
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mount-rep-failure
          path: ${{ runner.temp }}/mount-rep-*.log
          if-no-files-found: ignore
