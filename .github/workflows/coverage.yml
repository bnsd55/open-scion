# The statement-coverage gate: the roadmap's v0.8.0 bar, measured over
# production code with a pinned tool, the exclusions checked in
# (scripts/coverage-exclusions.txt). The gate runs on the merged report
# of the measure partitions: the default backend and the Postgres
# backend, so a whole production backend (pg.rs) is not invisible to
# the number.
#
# No pull_request trigger on purpose: the PR lane does not pay for the
# coverage build, and an edit to this file is not a workflow-lane PR
# that every open PR must merge. The same reason bench.yml and soak.yml
# are their own files.
#
# The work is partitioned: nine runs lost the runner mid-suite at
# around the suite's end — a full instrumented suite is the heaviest
# thing this repository runs, and the runner's agent stops answering
# part-way through it, with every log. Each partition runs a hash
# slice of the suite under nextest (every test its own process, its
# own timeout), uploads its profiles, and the gate job rebuilds the
# instrumented binaries without tests and merges every partition's
# profiles into the one number it checks.

name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      phase:
        description: 'build = instrumented build only (warms the cache); measure = the full gate'
        required: false
        default: measure
        type: string

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull_request run may cancel the run before it; a push to main
  # may not — a run in progress finishes and verifies the head it ran
  # on. (This file has no pull_request trigger, so the expression
  # reads false on main.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # Everything the measure writes stays under the worktree's own target
  # dir; nothing goes to /tmp (the run that filled the runner's disk
  # wrote there).
  CARGO_LLVM_COV_TARGET_DIR: target/coverage

jobs:
  measure:
    name: coverage, ${{ matrix.backend }}, slice ${{ matrix.slice }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: the default backend
            value: ""
            name: sqlite
            slice: 1
          - backend: the default backend
            value: ""
            name: sqlite
            slice: 2
          - backend: the default backend
            value: ""
            name: sqlite
            slice: 3
          - backend: the default backend
            value: ""
            name: sqlite
            slice: 4
          - backend: the postgres backend
            value: postgres
            name: postgres
            slice: 1
          - backend: the postgres backend
            value: postgres
            name: postgres
            slice: 2
          - backend: the postgres backend
            value: postgres
            name: postgres
            slice: 3
          - backend: the postgres backend
            value: postgres
            name: postgres
            slice: 4
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        if: inputs.phase != 'build'
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The instrumented build is one build: every matrix cell and
          # the gate share it, and the first run to finish saves it —
          # even a failed one, so one green build phase turns every
          # later run into the warm measure.
          key: coverage-instrumented
          cache-on-failure: true
      # cargo-llvm-cov, pinned by version and the release tarball's
      # sha256 (the same discipline the action pins follow), downloaded
      # with curl so no third-party action enters the supply chain.
      # v0.9.1 is the newest release at least two weeks old when this
      # pin was made (2026-09-06).
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          # An empty file holds no patterns, and an empty regex would
          # match everything: the flag is passed only when a pattern
          # exists.
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      # The profile the gate merges carries the measure's conditions in
      # its name, so the download on the gate job lands under the same
      # name cargo-llvm-cov's report step looks for: it merges every
      # *.profraw in the target dir into <workspace>.profdata, and
      # keeps an existing profdata when no profraw is present.
      - name: the profile's name, from the checkout's shape
        run: echo "COVERAGE_PROFILE=$(basename "$GITHUB_WORKSPACE").profdata" >> "$GITHUB_ENV"
      # A vacuous exclusion is the same bug class as the soak's zero
      # counts: a pattern that matches no tracked file excludes nothing
      # and promises a number the report does not hold. The gate reads
      # the file, so this guard runs before the measures.
      - name: every exclusion pattern matches a tracked file
        run: |
          ok=1
          while IFS= read -r pattern; do
            if ! git ls-files | grep -qE "$pattern"; then
              echo "the exclusion pattern '$pattern' matches no tracked file"
              ok=0
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
          [ "$ok" = 1 ]
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # A leaner instrumented build: no debuginfo (coverage needs the
      # coverage mapping, not DWARF), stripped binaries, and a linker
      # that keeps less of its working set in RAM. The agent that dies
      # is the largest process when the linker and the agent share a
      # 7 GB machine. The swap file gives the suite's tail somewhere to
      # go instead of the OOM killer.
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # The image ships dozens of gigabytes of toolchains this job
      # never touches; they go.
      - name: free the runner's disk for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          # The image may already run a swap file (this one does);
          # only grow the machine when it has none.
          if [ -z "$(swapon --show)" ]; then
            sudo fallocate -l 4G /covswap && sudo chmod 600 /covswap               && sudo mkswap /covswap && sudo swapon /covswap || true
          fi
          swapon --show || true
          df -h / | tail -1; free -m | awk 'NR==2'
      - name: stale profiles go, the cached build stays
        run: rm -f target/coverage/*.profraw target/coverage/*.profdata target/coverage/*-profraw-list
      - name: build only, this run warms the cache
        if: inputs.phase == 'build'
        run: |
          set -o pipefail
          # The README's recipe for building the instrumented binaries
          # without running anything: show-env exports the instrumentation
          # RUSTFLAGS and the profile environment, plain cargo builds the
          # workspace against them. --no-run is deprecated in v0.9.1 and
          # means 'report without tests', not 'build without tests'.
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          nice -n 19 cargo build --workspace --tests \
            | tee measure.log
      - name: measure
        if: inputs.phase != 'build'
        run: |
          set -o pipefail
          # The watcher doubles as a guard: a runner whose disk fills or
          # whose memory drains loses its agent mid-suite, with every
          # log — so the measure fails itself, loudly, while there is
          # still room to log the numbers.
          ( while sleep 30; do date -u +%T; df -h / | tail -1; free -m | awk 'NR==2'; du -sh target/coverage 2>/dev/null; \
              find target/coverage -maxdepth 1 -name '*.profraw' 2>/dev/null | wc -l; \
              avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9'); \
              mem=$(free -m | awk 'NR==2 {print $7}'); \
              { [ "$avail" -gt 3 ] && [ "$mem" -gt 600 ]; } || { echo 'the runner is out of disk or memory'; df -h /; free -m; ps aux --sort=-rss | head -12; exit 2; }; done ) &
          watcher=$!
          # nextest isolates every test in its own process with its own
          # timeout, and the hash partition takes a slice of the suite:
          # no runner carries more than a slice. The README's
          # external-tests recipe again — show-env exports the same
          # flags the build phase built with, plain cargo nextest runs
          # the tests against those binaries, so the measure never
          # recompiles what the build phase cached. The measure's
          # output goes to a file, not the step log: the agent
          # buffers what it streams.
          mkdir -p .config
          printf '[profile.default]\ntimeout = "600s"\nretries = 1\nslow-timeout = { period = "60s", terminate-after = 8 }\n' > .config/nextest.toml
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # A hard cap 15 minutes under the wall the agent dies at:
          # setup costs the job about a quarter of an hour, so the cap
          # fires a half hour before the wall, the step fails cleanly,
          # and its log uploads with the watcher's trend in it.
          # The Postgres slices mirror ci.yml's postgres job's scope:
          # it proves backend parity for open-scion-server only, and
          # the scn crate's tests read sqlite-typed rows by
          # construction. The default-backend slices cover the rest of
          # the workspace; the merged number sees it all.
          if [ "${{ matrix.value }}" = postgres ]; then
            pkgs="-p open-scion-server"
          else
            pkgs="--workspace"
          fi
          # shellcheck disable=SC2086
          nice -n 19 timeout -k 60 900 cargo nextest run $pkgs \
            --no-fail-fast \
            --partition hash:${{ matrix.slice }}/4 \
            > measure.log 2>&1
          status=$?
          kill "$watcher"
          tail -30 measure.log
          exit "$status"
        env:
          PROPTEST_CASES: "64"
          SCION_TEST_BACKEND: ${{ matrix.value }}
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
      # The slice's own profraw set, uploaded raw: the gate job merges
      # every partition's profiles into the one number it checks.
      - name: upload the slice's profiles
        if: inputs.phase != 'build'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.name }}-${{ matrix.slice }}
          path: target/coverage/*.profraw
          if-no-files-found: error
      - name: the profiles leave the cache, the build stays
        if: always()
        run: |
          # target/coverage holds the instrumented build and the
          # profiles; the build is what the cache warms from, so only
          # the profiles go.
          rm -f target/coverage/*.profraw target/coverage/*.profdata \
            target/coverage/*-profraw-list target/coverage/backend-summary.txt \
            target/coverage/measure.log 2>/dev/null || true
      - name: the measure's log, even on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measure-log-${{ matrix.name }}-${{ matrix.slice }}
          path: measure.log
          if-no-files-found: ignore

  gate:
    name: coverage, the gate
    if: inputs.phase != 'build'
    needs: [measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Same instrumented build the measures saved.
          key: coverage-instrumented
          cache-on-failure: true
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      - name: the profiles of every slice
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: target/coverage
          merge-multiple: true
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      # The report needs the instrumented binaries, but no test run:
      # show-env plus a plain build provide them, the downloaded
      # profiles carry the counts, and the report step merges every
      # profile in the target dir into the number the gate checks. The
      # proof below reads its printed list.
      - name: the merged report, and the gate
        run: |
          set -o pipefail
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          nice -n 19 cargo build --workspace --tests
          cargo llvm-cov report --summary-only --fail-under-lines 80 \
            ${COVERAGE_IGNORE:+--ignore-filename-regex "$COVERAGE_IGNORE"} \
            | tee target/coverage/report-summary.txt
          # The proof the filter applies: no excluded file may appear
          # in the printed per-file list.
          while IFS= read -r pattern; do
            if grep -qE "$pattern" target/coverage/report-summary.txt; then
              echo "the report still shows a file matching the exclusion '$pattern'"
              exit 1
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
      - name: the profiles leave the cache, the build stays
        if: always()
        run: |
          rm -f target/coverage/*.profraw target/coverage/*.profdata \
            target/coverage/*-profraw-list target/coverage/report-summary.txt 2>/dev/null || true
