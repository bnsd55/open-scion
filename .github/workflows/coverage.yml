# The statement-coverage gate: the roadmap's v0.8.0 bar, measured over
# production code with a pinned tool, the exclusions checked in
# (scripts/coverage-exclusions.txt). The gate runs on the merged report
# of two measures, split by backend: one default-backend job runs the
# whole workspace against SQLite without a database container beside
# it, one Postgres job runs the server crate against Postgres with the
# service, each uploads its profiles, and the gate job rebuilds the
# instrumented binaries without tests and merges both uploads into the
# one number it checks. The build links two objects at a time and the
# suite runs two tests at a time, because the instrumented build plus
# the whole suite is the heaviest thing this repository runs and the
# runner's agent dies of memory when the machine is pushed harder.
#
# No pull_request trigger on purpose: the PR lane does not pay for the
# coverage build, and an edit to this file is not a workflow-lane PR
# that every open PR must merge. The same reason bench.yml and soak.yml
# are their own files.

name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull_request run may cancel the run before it; a push to main
  # may not — a run in progress finishes and verifies the head it ran
  # on. (This file has no pull_request trigger, so the expression
  # reads false on main.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # Everything the measure writes stays under the worktree's own target
  # dir; nothing goes to /tmp (the run that filled the runner's disk
  # wrote there).
  CARGO_LLVM_COV_TARGET_DIR: target/coverage
  # The instrumented build plus the whole suite is the heaviest thing
  # this repository runs, on a runner whose agent dies of memory: the
  # build links two objects at a time, the suite runs two tests at a
  # time, incremental compilation is off (the instrumented build is
  # rebuilt once and cached anyway), and the measure job's own cap is
  # 90 minutes, above the suite's measured wall but below the hour
  # where the agent stops answering.
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  measure-sqlite:
    name: coverage, the default backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The instrumented build is one build, saved even on a failed
          # run, so one green build turns every later run into the warm
          # measure.
          key: coverage-instrumented
          cache-on-failure: true
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          # An empty file holds no patterns, and an empty regex would
          # match everything: the flag is passed only when a pattern
          # exists.
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      # A vacuous exclusion is the same bug class as the soak's zero
      # counts: a pattern that matches no tracked file excludes nothing
      # and promises a number the report does not hold.
      - name: every exclusion pattern matches a tracked file
        run: |
          ok=1
          while IFS= read -r pattern; do
            if ! git ls-files | grep -qE "$pattern"; then
              echo "the exclusion pattern '$pattern' matches no tracked file"
              ok=0
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
          [ "$ok" = 1 ]
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # A leaner instrumented build: no debuginfo (coverage needs the
      # coverage mapping, not DWARF), stripped binaries, and a linker
      # that keeps less of its working set in RAM. The agent that dies
      # is the largest process when the linker and the agent share a
      # 7 GB machine. The swap file gives the suite's tail somewhere to
      # go instead of the OOM killer.
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      # The image ships dozens of gigabytes of toolchains this job
      # never touches; they go.
      - name: free the runner's disk for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          # The image may already run a swap file (this one does);
          # only grow the machine when it has none.
          if [ -z "$(swapon --show)" ]; then
            if sudo fallocate -l 4G /covswap \
              && sudo chmod 600 /covswap \
              && sudo mkswap /covswap \
              && sudo swapon /covswap; then
              echo "a 4G swap file is on"
            else
              echo "the swap file did not come up; the build lives without it"
            fi
          fi
          swapon --show || true
          df -h / | tail -1; free -m | awk 'NR==2'
      - name: stale profiles go
        run: rm -f target/coverage/*.profraw target/coverage/*.profdata target/coverage/*-profraw-list
      - name: measure, the default backend
        run: |
          set -o pipefail
          # The watcher doubles as a guard: a runner whose disk fills or
          # whose memory drains loses its agent mid-suite, with every
          # log — so the measure fails itself, loudly, while there is
          # still room to log the numbers.
          ( while sleep 30; do date -u +%T; df -h / | tail -1; free -m | awk 'NR==2'; du -sh target/coverage 2>/dev/null; \
              avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9'); \
              mem=$(free -m | awk 'NR==2 {print $7}'); \
              { [ "$avail" -gt 3 ] && [ "$mem" -gt 600 ]; } || { echo 'the runner is out of disk or memory'; df -h /; free -m; ps aux --sort=-rss | head -12; exit 2; }; done ) &
          watcher=$!
          mkdir -p .config
          printf '[profile.default]\ntimeout = "600s"\nretries = 1\nslow-timeout = { period = "60s", terminate-after = 8 }\n' > .config/nextest.toml
          # The README's recipe: show-env exports the instrumentation
          # RUSTFLAGS and the profile environment, plain cargo nextest
          # runs the tests against the binaries the build makes. The
          # profiles accumulate in the target dir; the report step below
          # merges them into the one number the gate checks. nextest
          # isolates every test in its own process with its own timeout.
          # A per-process address-space cap of 6 GB: a test whose
          # allocations run away under instrumentation freezes the
          # runner in swap thrash and kills the agent with every log.
          # Under this cap the runaway test is the one that dies, and
          # the step fails cleanly with its name in the log.
          ulimit -v 6291456
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          nice -n 19 cargo nextest run --workspace --no-fail-fast \
            | tee measure.log
          kill "$watcher"

      - name: upload the measure's profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-sqlite
          path: target/coverage/*.profraw
          if-no-files-found: error
      - name: the measure's log, even on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measure-log-sqlite
          path: measure.log
          if-no-files-found: ignore
  measure-postgres:
    name: coverage, the postgres backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The instrumented build is one build, saved even on a failed
          # run, so one green build turns every later run into the warm
          # measure.
          key: coverage-instrumented
          cache-on-failure: true
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          # An empty file holds no patterns, and an empty regex would
          # match everything: the flag is passed only when a pattern
          # exists.
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      # A vacuous exclusion is the same bug class as the soak's zero
      # counts: a pattern that matches no tracked file excludes nothing
      # and promises a number the report does not hold.
      - name: every exclusion pattern matches a tracked file
        run: |
          ok=1
          while IFS= read -r pattern; do
            if ! git ls-files | grep -qE "$pattern"; then
              echo "the exclusion pattern '$pattern' matches no tracked file"
              ok=0
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
          [ "$ok" = 1 ]
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # A leaner instrumented build: no debuginfo (coverage needs the
      # coverage mapping, not DWARF), stripped binaries, and a linker
      # that keeps less of its working set in RAM. The agent that dies
      # is the largest process when the linker and the agent share a
      # 7 GB machine. The swap file gives the suite's tail somewhere to
      # go instead of the OOM killer.
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      # The image ships dozens of gigabytes of toolchains this job
      # never touches; they go.
      - name: free the runner's disk for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          # The image may already run a swap file (this one does);
          # only grow the machine when it has none.
          if [ -z "$(swapon --show)" ]; then
            if sudo fallocate -l 4G /covswap \
              && sudo chmod 600 /covswap \
              && sudo mkswap /covswap \
              && sudo swapon /covswap; then
              echo "a 4G swap file is on"
            else
              echo "the swap file did not come up; the build lives without it"
            fi
          fi
          swapon --show || true
          df -h / | tail -1; free -m | awk 'NR==2'
      - name: stale profiles go
        run: rm -f target/coverage/*.profraw target/coverage/*.profdata target/coverage/*-profraw-list
      - name: measure, the postgres backend
        run: |
          set -o pipefail
          ( while sleep 30; do date -u +%T; df -h / | tail -1; free -m | awk 'NR==2'; du -sh target/coverage 2>/dev/null; \
              avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9'); \
              mem=$(free -m | awk 'NR==2 {print $7}'); \
              { [ "$avail" -gt 3 ] && [ "$mem" -gt 600 ]; } || { echo 'the runner is out of disk or memory'; df -h /; free -m; ps aux --sort=-rss | head -12; exit 2; }; done ) &
          watcher=$!
          ulimit -v 6291456
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # The server crate is what ci.yml's postgres job proves, and
          # the profiles of the default measure already carry its
          # sqlite-side lines. The one excluded walk runs longer than
          # its timeout under postgres plus instrumentation.
          # SHORTCUT: one graph walk runs longer than eight minutes
          # under postgres plus instrumentation, because the ancestry
          # walk issues one query per node link. Remove this exclusion
          # when the batched ancestry walk lands.
          nice -n 19 cargo nextest run -p open-scion-server --no-fail-fast \
            -E 'not test(graph_queries_across_many_merges_answer)' \
            | tee measure-postgres.log
          kill "$watcher"
        env:
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          # The backup and crash tests restart the job's own database, as
          # ci.yml's postgres job lets them: the container's id is the
          # handle.
          SCION_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: upload the measure's profiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-postgres
          path: target/coverage/*.profraw
          if-no-files-found: error
      - name: the measure's log, even on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measure-log-postgres
          path: measure.log
          if-no-files-found: ignore
  gate:
    name: coverage, the gate
    needs: [measure-sqlite, measure-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-instrumented
          cache-on-failure: true
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      - name: the profiles of both measures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: target/coverage
          merge-multiple: true
      - name: the merged report, and the gate
        run: |
          set -o pipefail
          # The report needs the instrumented binaries, but no test run:
          # show-env plus a plain build provide them, the two measures'
          # profiles carry the counts, and the report step merges every
          # profile in the target dir into the number the gate checks.
          # The proof below reads its printed list. The target dirs are
          # pinned after show-env, absolute, so the merge looks where the
          # download put the profiles and nowhere else.
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          export CARGO_LLVM_COV_TARGET_DIR="$PWD/target/coverage"
          export CARGO_TARGET_DIR="$PWD/target/coverage"
          nice -n 19 cargo build --workspace --tests
          cargo llvm-cov report --summary-only --fail-under-lines 80 \
            ${COVERAGE_IGNORE:+--ignore-filename-regex "$COVERAGE_IGNORE"} \
            | tee target/coverage/report-summary.txt
          # The proof the filter applies: no excluded file may appear
          # in the printed per-file list.
          while IFS= read -r pattern; do
            if grep -qE "$pattern" target/coverage/report-summary.txt; then
              echo "the report still shows a file matching the exclusion '$pattern'"
              exit 1
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
