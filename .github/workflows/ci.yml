name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "2000"

  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "2000"

  msrv:
    name: check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  grpc-conformance:
    name: conformance (grpcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p open-scion-server
      # A client that is not the Rust one (issue #32): grpcurl calls
      # ResolveRef, GetRootTree and GetObjects with a ticket, and every
      # object hashes to its ID with b3sum. The script fetches the pinned
      # grpcurl release and checks its sha256 before it runs.
      - run: scripts/grpc-conformance.sh

  fuzz:
    name: fuzz smoke (3 x 20 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/scion-core/fuzz
            crates/scion-proto/fuzz
            crates/scion-server/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz the parsers
        run: |
          # The prebuilt cargo-fuzz defaults to a musl target, where the
          # address sanitizer cannot run.
          for crate in scion-core scion-proto scion-server; do
            fuzz_dir="$GITHUB_WORKSPACE/crates/$crate/fuzz"
            for target_file in "$fuzz_dir"/fuzz_targets/*.rs; do
              target=$(basename "$target_file" .rs)
              mkdir -p "$fuzz_dir/corpus/$target"
              seeds=()
              [ -d "$fuzz_dir/seeds/$target" ] && seeds+=("$fuzz_dir/seeds/$target")
              (cd "$GITHUB_WORKSPACE/crates/$crate" && cargo fuzz run \
                --target x86_64-unknown-linux-gnu "$target" \
                "$fuzz_dir/corpus/$target" "${seeds[@]}" \
                -- -max_total_time=20)
            done
          done
