name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The nightly: the same suite, on main, once a night. The v0.8.0 line
  # "the scheduled full suite passes 30 consecutive runs" counts these
  # runs (scripts/nightly-streak.sh reads them with --event schedule).
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull_request run may cancel the run before it (same branch,
  # superseded); a push to main may not: a run in progress finishes
  # and verifies the head it ran on, and while it runs only the
  # newest push waits — an older pending run is replaced, not run.
  # A 03:00 schedule and a push to main share one group, and neither
  # cancels: the nightly waits its turn.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every third-party action is pinned to the commit SHA its version tag
# named when this file last moved, with the version in a comment; Dependabot
# (github-actions, weekly) moves the pin and the comment together, except
# dtolnay/rust-toolchain, whose ref names a toolchain and must not move.
# Runners are fixed images, not -latest: a runner upgrade must be a diff,
# not a surprise.

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tier gate. It reads the pull request's own file list from the
  # API: no checkout, no fetch, no third-party action. A PR that touches
  # only docs/**, *.md or changes/** cannot change behavior, so
  # docs_only=true and only the docs tests run for it. The risk flags
  # add jobs: pg adds test (postgres), macos adds test (macOS),
  # workflows adds the release smoke. A draft PR skips every job, this
  # one included. Main, the nightly schedule and a dispatch run every
  # job as before.
  tier:
    name: what a pull request touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
      pg: ${{ steps.files.outputs.pg }}
      macos: ${{ steps.files.outputs.macos }}
      workflows: ${{ steps.files.outputs.workflows }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The path rules live here, once; the table is in the pull
          # request body. Each line names the file's change status and
          # path, so a file the pull request deletes is skipped before
          # any read of its content.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | "\(.status) \(.filename)"')
          docs_only=true
          pg=false
          macos=false
          workflows=false
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            status=${line%% *}
            file=${line#* }
            case "$file" in
              docs/*|*.md|changes/*) ;;
              *) docs_only=false ;;
            esac
            # Server code, and tests that opt into the Postgres
            # backend: the server's correctness depends on the
            # Postgres transaction order, so any change under the
            # server's src runs the Postgres tests; a test opts in
            # when its text names the shared backend or the env var,
            # and the globs catch the ones named pg or postgres, new
            # ones included.
            case "$file" in
              crates/scion-server/src/*|\
              crates/scion-server/migrations/*|\
              crates/scion-server/tests/*pg*.rs|\
              crates/scion-server/tests/*postgres*.rs) pg=true ;;
              crates/scion-server/tests/*.rs)
                # A file the pull request deletes has no content, so
                # it is skipped before the read; the path rules above
                # already applied to it. A file that cannot be read
                # runs Postgres rather than skipping it.
                if [ "$status" = removed ]; then
                  :
                elif ! content=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=${{ github.event.pull_request.head.sha }}" --jq '.content' 2>/dev/null); then
                  pg=true
                  echo "::notice::cannot read $file, running Postgres to be safe"
                elif printf '%s' "$content" | base64 -d 2>/dev/null \
                  | grep -q 'open_test\|SCION_TEST_BACKEND\|SCION_TEST_POSTGRES_URL'; then
                  pg=true
                fi
                ;;
            esac
            # macOS or filesystem code: the tier store, the scn vfs
            # and mount path, the permission checks — the ACL and
            # group-writable walk in the runtime auth module is
            # macOS-specific (#507 was a macOS-only bug there).
            case "$file" in
              crates/scion-tier/*|\
              crates/scion-proto/src/runtime/auth/*|\
              crates/scn/src/vfs.rs|\
              crates/scn/src/cmd/mount.rs|\
              crates/scn/src/cmd/checkout.rs|\
              crates/scn/src/materialize.rs) macos=true ;;
            esac
            # Workflow or release files. The lint job's actionlint
            # step already runs for every pull request; the release
            # smoke is the addition.
            case "$file" in
              .github/workflows/*|scripts/release*) workflows=true ;;
            esac
          done <<< "$files"
          {
            echo "docs_only=$docs_only"
            echo "pg=$pg"
            echo "macos=$macos"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: fmt + clippy
    needs: tier
    # Fast tier: every event, but on a pull request only a ready,
    # non-docs-only one. The tier job is skipped on main, the nightly
    # and a dispatch; the fast jobs then run as they always did.
    if: >-
      ${{ !cancelled() && (needs.tier.result == 'success' || needs.tier.result == 'skipped') && !github.event.pull_request.draft && needs.tier.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Depth 2: the changelog check names the pull request's own changes
      # as HEAD^1..HEAD, the base side of the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: every doc(hidden) item is behind test-hooks
        run: |
          scripts/check-test-seams.sh --self-test
          scripts/check-test-seams.sh
      - name: the changelog takes fragments, not edits
        if: github.event_name == 'pull_request'
        run: scripts/check-changelog.sh
      - name: the changelog merge script does what it says
        run: scripts/test-merge-changelog.sh
      # The release pipeline's tag verdicts, fed canned tag objects: no
      # CI run holds a signed release tag, so the decision is tested
      # here instead of being trusted.
      - name: the release tag verdicts hold (release-verify-tag)
        run: scripts/test-release-verify-tag.sh
      # A workflow that cannot parse fails here, on the PR that carries
      # it, not main's next push-triggered run (#416, #419). The
      # actionlint release is pinned by version and sha256.
      - name: the workflows parse (actionlint)
        run: scripts/lint-workflows.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Save from main only. A pull request restores main's cache;
          # per-branch caches (66) blew past the 10 GB ceiling and evicted
          # each other.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A release build has no dev-dependencies, so the test-hooks feature
      # stays off and every test-only item that a cfg misses shows up as
      # dead code. --all-targets unifies the dev-dependency that turns
      # the feature on, and cannot see this.
      - run: cargo clippy --workspace --lib --bins -- -D warnings

  docs:
    name: rustdoc
    needs: tier
    # The docs tests run on every event and for every ready pull
    # request; for a docs-only PR they are the only tier that runs.
    if: >-
      ${{ !cancelled() && (needs.tier.result == 'success' || needs.tier.result == 'skipped') && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  supply-chain:
    name: cargo-deny
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  test:
    name: test
    needs: tier
    # Fast tier: every event, but on a pull request only a ready,
    # non-docs-only one.
    if: >-
      ${{ !cancelled() && (needs.tier.result == 'success' || needs.tier.result == 'skipped') && !github.event.pull_request.draft && needs.tier.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
      - run: cargo test --workspace
        env:
          # The fast tier: a pull request runs 500 cases, main, the
          # nightly and a dispatch the full 2000.
          PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '500' || '2000' }}
      - name: the work tree is still clean after the tests
        run: |
          # A test that writes outside its sandbox (the #332 class) shows up
          # here: the suite must leave the checked-out tree as it found it.
          # The diff names the files, so the writer is one step away. New
          # untracked files count too (a stray bench-output.txt); target/
          # is gitignored, so the build stays out of the report.
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            git diff --exit-code || true
            echo "::error::the test suite left the work tree dirty: $dirty"
            exit 1
          fi
      - name: a real disk full (tmpfs)
        run: cargo test -p open-scion-server --test disk_full
        env:
          SCION_DISK_REQUIRE: "1"
      - name: block-level power cuts (dm-log-writes)
        run: |
          # replay-log, pinned at 7b70d8a6863c5de30933d42a7672d35d01d2dc6c so the tool cannot move under the test.
          git clone https://github.com/josefbacik/log-writes "$RUNNER_TEMP/dlw"
          git -C "$RUNNER_TEMP/dlw" checkout 7b70d8a6863c5de30933d42a7672d35d01d2dc6c
          gcc -O2 -o "$RUNNER_TEMP/replay-log" "$RUNNER_TEMP/dlw/replay-log.c" "$RUNNER_TEMP/dlw/log-writes.c"
          cargo test -p open-scion-server --test dm_log_writes
        env:
          SCION_DMW_REQUIRE: "1"
          SCION_DMW_REPLAY: ${{ runner.temp }}/replay-log

  test-postgres:
    name: test (postgres)
    needs: tier
    # Risk tier: a pull request that touches Postgres or metadata code
    # also runs this job, on one Postgres version as today. Main, the
    # nightly and a dispatch always run it.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.tier.result == 'success' && !github.event.pull_request.draft && needs.tier.outputs.docs_only != 'true' && needs.tier.outputs.pg == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
      - run: cargo test -p open-scion-server
        env:
          # The Postgres job proves backend parity, not more cases; the
          # SQLite jobs already run 2000.
          PROPTEST_CASES: "64"
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          # The backup test dumps the live metadata with the job's own
          # Postgres, so its tools match the server: the container name
          # points at the service container above, and the test never
          # stops it (the takeover step below does, after the tests).
          SCION_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      # The fault rows whose metadata half is Postgres itself: on this
      # backend the blob files live in the data directory of each step
      # below, and the metadata lives in the database, so a cut of the
      # data directory cannot cut the metadata. The SQLSTATE 53100 arm of
      # the disk-full mapping is a unit test of the run above.
      - name: a real disk full (tmpfs), on Postgres
        run: cargo test -p open-scion-server --test disk_full
        env:
          SCION_DISK_REQUIRE: "1"
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
      - name: block-level power cuts (dm-log-writes), on Postgres
        run: |
          # replay-log, pinned as in the SQLite job above.
          git clone https://github.com/josefbacik/log-writes "$RUNNER_TEMP/dlw"
          git -C "$RUNNER_TEMP/dlw" checkout 7b70d8a6863c5de30933d42a7672d35d01d2dc6c
          gcc -O2 -o "$RUNNER_TEMP/replay-log" "$RUNNER_TEMP/dlw/replay-log.c" "$RUNNER_TEMP/dlw/log-writes.c"
          cargo test -p open-scion-server --test dm_log_writes
        env:
          SCION_DMW_REQUIRE: "1"
          SCION_DMW_REPLAY: ${{ runner.temp }}/replay-log
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
      - name: the work tree is still clean after the tests
        run: |
          # New untracked files count too (a stray bench-output.txt);
          # target/ is gitignored, so the build stays out of the report.
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            git diff --exit-code || true
            echo "::error::the test suite left the work tree dirty: $dirty"
            exit 1
          fi

      # The takeover test stops the database and restarts it. The service
      # container of this job is the only postgres:17.11 on the runner, and
      # it belongs to this job alone, so it may go down and come back.
      # It must run after the tests above: it takes the database down
      # while it runs.
      - name: the database may go down, and the store recovers
        run: |
          container=$(docker ps --filter ancestor=postgres:17.11 --format '{{.Names}}' | head -1)
          test -n "$container"
          SCION_TEST_PG_CONTAINER="$container" \
          SCION_TEST_BACKEND=postgres \
          SCION_TEST_POSTGRES_URL=postgres://postgres:scion@localhost:5432/scion \
          cargo test -p open-scion-server --test backend_refusals -- --ignored

  test-macos:
    name: test (macOS)
    needs: tier
    # Risk tier: a pull request that touches the tier store, the scn
    # vfs or mount path, or the permission checks also runs this job.
    # Main, the nightly and a dispatch always run it.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.tier.result == 'success' && !github.event.pull_request.draft && needs.tier.outputs.docs_only != 'true' && needs.tier.outputs.macos == 'true')) }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
      # The Linux lint job never compiles macOS-only code (the ACL FFI
      # module among it), so clippy runs here, before the tests: same
      # warm cache, a couple of minutes on a job that already builds
      # everything, and no second macOS runner to book. --all-targets
      # covers the lib, the bins and the test code in one pass.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # A pull request runs 500 cases, main and the nightly 2000.
          PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '500' || '2000' }}
      - name: the work tree is still clean after the tests
        run: |
          # New untracked files count too (a stray bench-output.txt);
          # target/ is gitignored, so the build stays out of the report.
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            git diff --exit-code || true
            echo "::error::the test suite left the work tree dirty: $dirty"
            exit 1
          fi

  promtool:
    name: promtool
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # promtool, pinned to the current LTS line (3.13, supported on
      # prometheus.io's release-cycle page through 2027-07) by version
      # and the release tarball's sha256 (the same discipline the action
      # pins follow), downloaded with curl so no third-party action
      # enters the supply chain.
      - run: |
          curl -fsSL -o /tmp/prometheus.tgz \
            https://github.com/prometheus/prometheus/releases/download/v3.13.4/prometheus-3.13.4.linux-amd64.tar.gz
          echo "87f21a66f96c597a189cef8d640e8921b621fc17a9feff707c332c4f3b3ddd56  /tmp/prometheus.tgz" | sha256sum -c -
          mkdir /tmp/promtool
          tar -xzf /tmp/prometheus.tgz -C /tmp/promtool --strip-components 1
          /tmp/promtool/promtool check rules deploy/prometheus/openscion-alerts.yml
          /tmp/promtool/promtool test rules deploy/prometheus/openscion-alerts-test.yml

  power-loss:
    name: power-loss
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # The second run opens a Postgres-backed store on the same LazyFS:
      # the blob files take the cuts, the metadata sits in the database's
      # own WAL, and the run proves the store reads what the cut left.
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCION_POWER_REQUIRE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cache the LazyFS build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/lazyfs/lazyfs/build
            ${{ runner.temp }}/lazyfs/libs/libpcache/build
          key: lazyfs-0.3.1-045a0b3
      - name: LazyFS (pinned 0.3.1, commit 045a0b3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse3-dev libfuse3-3 fuse3
          # The mount script passes -o allow_other; a non-root user may only
          # do that when fuse.conf allows it.
          sudo sed -i 's/^#user_allow_other/user_allow_other/' /etc/fuse.conf
          cd "$RUNNER_TEMP"
          # The cache may hold the two build directories already; overlay a
          # fresh pinned clone over them instead of cloning in place.
          git clone --depth 1 --branch 0.3.1 https://github.com/dsrhaslab/lazyfs lazyfs-checkout
          got=$(git -C lazyfs-checkout rev-parse HEAD)
          echo "pinned: $got"
          test "$got" = "045a0b3a1126725e693934e29d3ba15e08cc39ec"
          mkdir -p lazyfs
          cp -a lazyfs-checkout/. lazyfs/
          rm -rf lazyfs-checkout
          if [ ! -x lazyfs/lazyfs/build/lazyfs ]; then
            (cd lazyfs/libs/libpcache && ./build.sh)
            (cd lazyfs/lazyfs && ./build.sh)
          fi
          test -x lazyfs/lazyfs/build/lazyfs
          test -f lazyfs/libs/libpcache/build/libpcache.so.0
      - name: run
        env:
          SCION_LAZYFS: ${{ runner.temp }}/lazyfs
          SCION_LAZYFS_TRACE_DIR: ${{ runner.temp }}/lazyfs-trace
        run: cargo test -p open-scion-server --test power
      - name: run (postgres)
        env:
          SCION_LAZYFS: ${{ runner.temp }}/lazyfs
          SCION_LAZYFS_TRACE_DIR: ${{ runner.temp }}/lazyfs-trace
          SCION_TEST_BACKEND: postgres
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
        # One server of the database at a time: the binary's Postgres open
        # takes the database's one-server lock, so the suite runs serially
        # here. The SQLite run above stays parallel.
        run: cargo test -p open-scion-server --test power -- --test-threads=1
      # The suite writes the LazyFS ops trace to
      # $SCION_LAZYFS_TRACE_DIR/lazyfs-r<N>.log; on a failure the trace
      # says what the cut actually persisted.
      - name: upload the LazyFS trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lazyfs-trace
          path: |
            ${{ runner.temp }}/lazyfs-trace/lazyfs-r*.log
            ${{ runner.temp }}/lazyfs-trace/race-*.log
          if-no-files-found: ignore

  nfs-mount:
    name: mount (NFS)
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The second run mounts an NFS server whose store is Postgres-backed:
      # the marker and the blob files sit on the NFS mount, the metadata
      # sits in the database, and the run proves the mount of that half.
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the kernel NFS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nfs-common
      # The script wraps every external command in `timeout`, and its trap
      # force-unmounts and kills the server and the mount on any exit, so
      # a failed step cannot hang the runner until this cap.
      - name: run the mount script
        run: timeout 600 scripts/mount-nfs.sh
      - name: run the mount script (postgres)
        run: |
          SCION_TEST_BACKEND=postgres \
          SCION_TEST_POSTGRES_URL=postgres://postgres:scion@localhost:5432/scion \
          timeout 600 scripts/mount-nfs.sh

  publish-check:
    name: publish check
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      # One invocation, in dependency order: cargo resolves a packaged
      # crate's path dependencies from the siblings of the same run, so a
      # split run fails on the first unpublished dependency. The verify
      # build is the point: a build.rs input or an include! path that does
      # not ship only fails here.
      - run: cargo package -p open-scion-core -p open-scion-proto -p open-scion-server -p open-scion-tier -p open-scion

  msrv:
    name: check (MSRV)
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88, the MSRV: do not move
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.88 check --locked --workspace --all-targets --all-features

  grpc-conformance:
    name: conformance (grpcurl)
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p open-scion-server
      # A client that is not the Rust one (issue #32): grpcurl calls
      # ResolveRef, GetRootTree and GetObjects with a ticket, and every
      # object hashes to its ID with b3sum. The script fetches the pinned
      # grpcurl release and checks its sha256 before it runs.
      - run: scripts/grpc-conformance.sh

  docker:
    name: docker demo
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The layer cache holds the release build: the first run takes about
      # five minutes, a run after an ordinary push about one. The cache
      # export needs the container driver, not the default docker one.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: open-scion-demo
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run the demo (SQLite)
        run: sh docker/demo.sh
      - name: run the demo (Postgres)
        run: sh docker/demo.sh postgres

  fuzz:
    name: fuzz smoke (60 s)
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/scion-core/fuzz
            crates/scion-proto/fuzz
            crates/scion-server/fuzz
            crates/scion-tier/fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: fuzz the parsers
        run: |
          # The prebuilt cargo-fuzz defaults to a musl target, where the
          # address sanitizer cannot run. The targets run four at a time:
          # serially they cost ~11 min, the job's own tail.
          run_target() {
            crate="$1" target="$2"
            fuzz_dir="$GITHUB_WORKSPACE/crates/$crate/fuzz"
            mkdir -p "$fuzz_dir/corpus/$target"
            seeds=()
            [ -d "$fuzz_dir/seeds/$target" ] && seeds+=("$fuzz_dir/seeds/$target")
            (cd "$GITHUB_WORKSPACE/crates/$crate" && cargo fuzz run \
              --target x86_64-unknown-linux-gnu "$target" \
              "$fuzz_dir/corpus/$target" "${seeds[@]}" \
              -- -max_total_time=20) || exit 1
          }
          export -f run_target
          for crate in scion-core scion-proto scion-server scion-tier; do
            fuzz_dir="$GITHUB_WORKSPACE/crates/$crate/fuzz"
            for target_file in "$fuzz_dir"/fuzz_targets/*.rs; do
              target=$(basename "$target_file" .rs)
              printf '%s %s\n' "$crate" "$target"
            done
          done | xargs -n2 -P4 bash -c 'run_target "$@"' _

  release-smoke:
    name: release smoke (${{ matrix.os }})
    needs: tier
    # Risk tier: a pull request that touches a workflow or a release
    # script also runs this job. Main, the nightly and a dispatch
    # always run it.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.tier.result == 'success' && !github.event.pull_request.draft && needs.tier.outputs.docs_only != 'true' && needs.tier.outputs.workflows == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The README quick start on the release binaries, twice (umask 022
      # and 002): import, ticket-key, serve, scn reads and writes, fsck,
      # and a one-signal shutdown that must exit 0, on Linux and macOS.
      - run: scripts/release-smoke.sh

  nightly-streak:
    name: nightly streak
    # The slow tier: main, the nightly and a dispatch only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A report, not a gate: the v0.8.0 line "the scheduled full suite
    # passes 30 consecutive runs" is a fact this job prints, and the run
    # history is where anyone re-checks it. Read-only over the runs.
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the current streak of the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/nightly-streak.sh
