name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "2000"

  test-macos:
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "2000"

  power-loss:
    name: power-loss
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCION_POWER_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - name: cache the LazyFS build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/lazyfs/lazyfs/build
            ${{ runner.temp }}/lazyfs/libs/libpcache/build
          key: lazyfs-0.3.1-045a0b3
      - name: LazyFS (pinned 0.3.1, commit 045a0b3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse3-3 fuse3
          cd "$RUNNER_TEMP"
          git clone --depth 1 --branch 0.3.1 https://github.com/dsrhaslab/lazyfs lazyfs
          got=$(git -C lazyfs rev-parse HEAD)
          echo "pinned: $got"
          test "$got" = "045a0b3a1126725e693934e29d3ba15e08cc39ec"
          if [ ! -x lazyfs/build/lazyfs ]; then
            (cd lazyfs/libs/libpcache && ./build.sh)
            (cd lazyfs && ./build.sh)
          fi
          test -x lazyfs/build/lazyfs
          test -f lazyfs/libs/libpcache/build/libpcache.so.0
      - name: run
        env:
          SCION_LAZYFS: ${{ runner.temp }}/lazyfs
        run: cargo test -p open-scion-server --test power

  msrv:
    name: check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  grpc-conformance:
    name: conformance (grpcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p open-scion-server
      # A client that is not the Rust one (issue #32): grpcurl calls
      # ResolveRef, GetRootTree and GetObjects with a ticket, and every
      # object hashes to its ID with b3sum. The script fetches the pinned
      # grpcurl release and checks its sha256 before it runs.
      - run: scripts/grpc-conformance.sh

  fuzz:
    name: fuzz smoke (60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/scion-core/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz decode
        working-directory: crates/scion-core
        run: |
          fuzz_dir="$GITHUB_WORKSPACE/crates/scion-core/fuzz"
          mkdir -p "$fuzz_dir/corpus/decode"
          # The prebuilt cargo-fuzz defaults to a musl target, where the
          # address sanitizer cannot run.
          cargo fuzz run --target x86_64-unknown-linux-gnu decode \
            "$fuzz_dir/corpus/decode" "$fuzz_dir/seeds/decode" -- -max_total_time=60
