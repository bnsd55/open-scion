name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 03:07 UTC — off the soak (02:30) and the version
    # matrix's own slot, so no two heavy scans queue together.
    - cron: "7 3 * * 1"

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does. The two
# codeql-action pins share one commit: the subactions version together.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  # A pull_request run may cancel the run before it (same branch,
  # superseded); a push to main may not: a run in progress finishes
  # and verifies the head it ran on, and while it runs only the
  # newest push waits — an older pending run is replaced, not run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The one write this job needs: it uploads its own SARIF result to
      # code scanning. Nothing else in the job touches the repo.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            # `none` is the build mode the CodeQL docs name for Rust: the
            # database is extracted from the sources without building, so
            # no cargo step and no toolchain step run here.
            build-mode: none
          - language: actions
            # Workflows are config data: there is nothing to build.
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
