[package]
name = "scion-tier-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
# The fuzz workspace is private, but cargo-deny reads every crate it
# resolves, so it carries the workspace license.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
open-scion-tier = { path = ".." }

[[bin]]
name = "snapshot-seed"
path = "fuzz_targets/snapshot-seed.rs"
test = false
doc = false
bench = false

# Fuzzing builds on nightly with its own lockfile, outside the main workspace.
[workspace]
