[package]
name = "open-scion"
description = "Command-line client for the Scion version control system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[[bin]]
name = "scn"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
hashlink.workspace = true
nfsserve.workspace = true
rustix.workspace = true
open-scion-core.workspace = true
open-scion-proto.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true

[features]
# The integration tests drive the pieces the binary uses only from
# outside, which the feature makes reachable (#332: nothing gated may
# live ungated in a release build).
test-hooks = []
# The writable overlay mount and `scn commit --from-mount`, off by
# default: a planted parent symlink in the overlay can still redirect a
# write outside it (the SHORTCUT row of `vfs.rs`'s `open_overlay_write`
# in architecture.md section 9), so a default or release build has no
# write path at all, and the read-only mount stays. The flag and the
# mount argument exist in every build; a build without the feature
# refuses both by name. Out until v1.0.0 passes (ROADMAP D24).
unstable-writable-mount = []

[dev-dependencies]
rcgen.workspace = true
# The rotation test builds the tier key sets by hand.
ed25519-dalek.workspace = true
# scn's tests drive the server's test seams, which the feature turns on.
open-scion-server = { workspace = true, features = ["test-hooks"] }
# scn's tests drive scn's own test seam, which the feature turns on.
# Path only: a version would make `cargo package` resolve it from the
# registry.
open-scion = { path = ".", features = ["test-hooks"] }
# The keepalive test shortens the client keepalive through the seam,
# which the feature turns on for the test build's scion-proto.
open-scion-proto = { workspace = true, features = ["test-hooks"] }
# The keepalive test moves the relay's bytes with tokio's ext traits.
tokio = { workspace = true, features = ["io-util"] }
open-scion-tier.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true
# The upgrade test reads the database of a schema-6 data directory.
rusqlite.workspace = true

[lints]
workspace = true
