[package]
name = "open-scion-server"
description = "Server for the Scion version control system: storage, commits, lands and reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lib]
name = "scion_server"

[[bin]]
name = "scion-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
clap.workspace = true
gix.workspace = true
hashlink.workspace = true
rusqlite.workspace = true
rustix.workspace = true
open-scion-core.workspace = true
open-scion-proto.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tonic-health.workspace = true
# A test runs code while a commit is visible and its COMMIT still runs.
rusqlite = { workspace = true, features = ["hooks"] }
# Tests of the reply timeouts run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# A test fetches from a real server through a tier with no token.
open-scion-tier = { workspace = true }

[lints]
workspace = true
