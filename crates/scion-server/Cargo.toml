[package]
name = "open-scion-server"
description = "Server for the Scion version control system: storage, commits, lands and reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lib]
name = "scion_server"

[[bin]]
name = "scion-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
tower.workspace = true
clap.workspace = true
gix.workspace = true
hashlink.workspace = true
rusqlite.workspace = true
jiff = "0.2"
serde_json.workspace = true
rustix.workspace = true
open-scion-core.workspace = true
open-scion-proto.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true
postgres = "0.19"
tokio-postgres-rustls = "0.14"

[features]
# The test seams (`#[doc(hidden)]` items gated on this) that an
# integration test needs: the crate enables the feature on itself as its
# own dev-dependency, and a default build does not compile the seams.
# Path only: a version would make `cargo package` resolve it from the
# registry.
test-hooks = []

[dev-dependencies]
# The h2-level proof of the reply-memory budget's release on a reset:
# only a raw HTTP/2 client can open a call and reset it unread.
h2 = "0.4"
open-scion-server = { path = ".", features = ["test-hooks"] }
# The ledger's own hash, on purpose not the store's BLAKE3 (#377).
sha2 = "0.11.1"
proptest.workspace = true
tempfile.workspace = true
tonic-health.workspace = true
# A test runs code while a commit is visible and its COMMIT still runs.
rusqlite = { workspace = true, features = ["hooks"] }
# Tests of the reply timeouts run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# A test fetches from a real server through a tier with no token.
open-scion-tier = { workspace = true }

[lints]
workspace = true
