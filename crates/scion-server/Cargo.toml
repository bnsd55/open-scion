[package]
name = "scion-server"
description = "Server for the Scion version control system: storage, commits, lands and reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
clap.workspace = true
gix.workspace = true
hashlink.workspace = true
rusqlite.workspace = true
rustix.workspace = true
scion-core.workspace = true
scion-proto.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[dev-dependencies]
proptest.workspace = true
# A test runs code while a commit is visible and its COMMIT still runs.
rusqlite = { workspace = true, features = ["hooks"] }
# Tests of the reply timeouts run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
