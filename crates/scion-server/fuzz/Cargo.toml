[package]
name = "scion-server-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
open-scion-core = { path = "../../scion-core" }
# The fuzz targets drive the server's internals (blame, memory, write,
# meta), which only the test-hooks feature makes reachable.
open-scion-server = { path = "..", features = ["test-hooks"] }
tempfile = "3"

[[bin]]
name = "blame-cursor"
path = "fuzz_targets/blame-cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write-decode"
path = "fuzz_targets/write-decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "access"
path = "fuzz_targets/access.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive-verify"
path = "fuzz_targets/archive-verify.rs"
test = false
doc = false
bench = false

# Fuzzing builds on nightly with its own lockfile, outside the main workspace.
[workspace]
