[package]
name = "scion-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
# The fuzz workspace is private, but cargo-deny reads every crate it
# resolves, so it carries the workspace license.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
open-scion-core = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repo-path"
path = "fuzz_targets/repo-path.rs"
test = false
doc = false
bench = false

# Fuzzing builds on nightly with its own lockfile, outside the main workspace.
[workspace]
