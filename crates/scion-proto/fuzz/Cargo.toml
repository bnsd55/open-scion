[package]
name = "scion-proto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
# The fuzz workspace is private, but cargo-deny reads every crate it
# resolves, so it carries the workspace license.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "rand_core"] }
open-scion-proto = { path = ".." }
prost = "0.14"

[[bin]]
name = "object"
path = "fuzz_targets/object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request-id"
path = "fuzz_targets/request-id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check-name"
path = "fuzz_targets/check-name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ticket"
path = "fuzz_targets/ticket.rs"
test = false
doc = false
bench = false

# Fuzzing builds on nightly with its own lockfile, outside the main workspace.
[workspace]
