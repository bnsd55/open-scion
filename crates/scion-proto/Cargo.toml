[package]
name = "open-scion-proto"
description = "gRPC API definitions for the Scion version control system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lib]
name = "scion_proto"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
bytes.workspace = true
ed25519-dalek.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
open-scion-core.workspace = true
tower.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
# The unix-socket bind (listen.rs) and #356's checked reads name the owner.
rustix.workspace = true
tonic = { workspace = true, features = ["tls-ring"] }
tonic-health.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
# The protocol-surface golden decodes the descriptor set the build
# wrote: the surface is what the compiler saw, not a hand parse.
prost-types = "0.14"

[build-dependencies]
tonic-prost-build.workspace = true

[lints]
workspace = true
