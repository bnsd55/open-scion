// Scion RPC API, version 1.
//
// Every request names a repository. IDs are 32 raw bytes. Paths are raw bytes
// split on '/'. Changesets and trees travel in the v1 byte format
// (docs/format-v1.md), so clients decode them with scion-core.
//
// Reads take a changeset ID, never a ref name: every read targets an immutable
// object, so any cache tier can answer it. Resolve a ref first with ResolveRef.

syntax = "proto3";

package scion.v1;

service Scion {
  // Write path.

  // Stores one file. Only the first message names the repo; later messages
  // leave it empty. Every message carries the next chunk of the file. Returns
  // the blob ID. Safe to repeat.
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  // Stores a changeset with exactly one parent. Safe to repeat: the ID is the
  // content.
  rpc CreateChangeset(CreateChangesetRequest) returns (CreateChangesetResponse);
  // Rebases a changeset onto a ref and moves the ref. A retry with the same
  // request key returns the same land. Fails with ABORTED if the ref keeps
  // moving under the land; retry with the same key.
  rpc Land(LandRequest) returns (LandResponse);
  // Returns the current state of a land.
  rpc GetLand(GetLandRequest) returns (LandResponse);

  // Read path.

  // Deprecated: use Objects.ResolveRef, which a cache tier forwards. Kept so
  // existing clients still work; both share one implementation.
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  rpc GetChangeset(GetChangesetRequest) returns (GetChangesetResponse);
  // Streams the content of a regular file or the target of a symlink.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // Returns one directory level as a TreeV1 object.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  // Walks first parents, newest first. With a path, returns only the
  // changesets that change it.
  rpc Log(LogRequest) returns (LogResponse);
  // Which changeset last changed each line of a file, on first-parent
  // history.
  rpc Blame(BlameRequest) returns (BlameResponse);

  // Queries on the changeset graph and on snapshots. Each call has a bound
  // on its work.

  // The best common ancestors of two changesets, over all parents: every
  // common ancestor that is not an ancestor of another common ancestor, as
  // `git merge-base --all`. The walk has no step bound: it stops at the
  // call's deadline with DEADLINE_EXCEEDED, or with CANCELLED when the
  // client drops the call.
  rpc MergeBase(MergeBaseRequest) returns (MergeBaseResponse);
  // Whether one changeset is an ancestor of another, over all parents. A
  // changeset is its own ancestor. The walk has no step bound: it stops at
  // the call's deadline with DEADLINE_EXCEEDED, or with CANCELLED when the
  // client drops the call.
  rpc IsAncestor(IsAncestorRequest) returns (IsAncestorResponse);
  // The paths whose file state differs between the snapshots of two
  // changesets. Compares file states, not lines. Finds renames as `git diff`
  // does by default.
  rpc Diff(DiffRequest) returns (DiffResponse);
}

// Object reads. `ResolveRef` and `GetRootTree` go to the server: they need
// the token, and the server answers `GetRootTree` with a read ticket.
// `GetObjects` takes that ticket and no token, so a cache tier can answer
// it. Each name names an immutable object, so a tier may cache its answer,
// but only after a walk from the ticket's root tree reaches it. A client
// asks only for the objects it wants, starting at the root tree, and checks
// each object against its ID on arrival.
service Objects {
  // Where a ref points. Mutable: a tier forwards it and never caches it.
  rpc ResolveRef(ResolveRefRequest) returns (ResolveRefResponse);
  // The root tree of a changeset.
  rpc GetRootTree(GetRootTreeRequest) returns (GetRootTreeResponse);
  // Streams the requested objects in request order. Each object comes in
  // parts of at most 1 MiB of encoded data (see ObjectPart), in an encoding
  // that the request accepts. A reply sends the next object only while it
  // has sent less than 64 MiB of encoded data. So it holds at least one
  // object, and at most 64 MiB plus one object. The client asks again for
  // the rest. An error status of the call itself is about the whole call:
  // for example NOT_FOUND for a repo that does not exist, or
  // RESOURCE_EXHAUSTED when the server has no memory for the first object
  // (ask again later). An error in the stream, after the call started, is
  // about the object in progress, or the next one if none is (NOT_FOUND if
  // it does not exist), and ends the reply.
  rpc GetObjects(GetObjectsRequest) returns (stream ObjectPart);
}

message PutBlobRequest {
  string repo = 1;
  bytes data = 2;
}

message PutBlobResponse {
  bytes blob_id = 1;
}

message CreateChangesetRequest {
  string repo = 1;
  // ChangesetV1 bytes.
  bytes changeset = 2;
}

message CreateChangesetResponse {
  bytes changeset_id = 1;
}

message LandRequest {
  string repo = 1;
  bytes changeset_id = 2;
  string target_ref = 3;
  // Chosen by the caller. Unique per repo and caller.
  string request_key = 4;
}

message GetLandRequest {
  string repo = 1;
  string land_id = 2;
}

enum LandState {
  LAND_STATE_UNSPECIFIED = 0;
  LAND_STATE_PENDING = 1;
  LAND_STATE_LANDED = 2;
  // A path in the changeset changed on the ref after the changeset's base.
  LAND_STATE_CONFLICT = 3;
  // The land can never succeed, for example the base is not on the ref.
  LAND_STATE_REJECTED = 4;
}

message LandResponse {
  string land_id = 1;
  LandState state = 2;
  // The rebased changeset now at the tip of the ref. Set when LANDED.
  bytes result_changeset_id = 3;
  // Why the land is CONFLICT or REJECTED.
  string detail = 4;
  // Paths that conflict with a change on the ref after the base. Empty for a
  // CONFLICT whose changes do not apply to the head's tree (detail says why),
  // and for every other state.
  repeated bytes conflict_paths = 5;
}

message ResolveRefRequest {
  string repo = 1;
  string name = 2;
}

message ResolveRefResponse {
  bytes changeset_id = 1;
}

message GetChangesetRequest {
  string repo = 1;
  bytes changeset_id = 2;
}

message GetChangesetResponse {
  // ChangesetV1 bytes.
  bytes changeset = 1;
}

message ReadFileRequest {
  string repo = 1;
  bytes changeset_id = 2;
  bytes path = 3;
}

message ReadFileResponse {
  bytes data = 1;
}

message ListDirRequest {
  string repo = 1;
  bytes changeset_id = 2;
  // Empty means the repo root.
  bytes path = 3;
}

message ListDirResponse {
  // TreeV1 bytes.
  bytes tree = 1;
}

message LogRequest {
  string repo = 1;
  bytes changeset_id = 2;
  uint32 limit = 3;
  // Optional. Only changesets that change this path: the file itself, or
  // anything below it if it is a directory. Empty means every changeset.
  bytes path = 4;
}

message LogResponse {
  repeated LogEntry entries = 1;
  // Where the next call starts: the first changeset this reply does not
  // cover. Empty when the history ends. A call checks a bounded number of
  // changesets, so a path log can return no entries and still set this.
  bytes next_changeset_id = 2;
}

message LogEntry {
  bytes changeset_id = 1;
  // ChangesetV1 bytes.
  bytes changeset = 2;
}

message BlameRequest {
  string repo = 1;
  bytes changeset_id = 2;
  bytes path = 3;
  // Optional. Where the last call stopped: a reply's next_cursor, sent
  // back unchanged with the same repo, changeset_id and path. Empty starts
  // a first blame. The cursor is opaque to clients.
  bytes cursor = 7;
  reserved 4, 5;
  reserved "rename_searched", "rename_best";
}

message BlameResponse {
  // Line ranges in file order. Together they cover the lines of the
  // window this call answered, from after_line to its end, once each.
  repeated BlameRange ranges = 1;
  // The author of each changeset that a range names, once each.
  repeated BlameChangeset changesets = 2;
  // Set when more lines are left to blame: the lines after this call's
  // window, or the rest of this window when the call stopped at a bound.
  // The ranges without a changeset came from the changeset in the cursor
  // or an older one. The client MUST send next_cursor back unchanged, with
  // the same repo, changeset_id and path, to get the next part. Empty when
  // the blame is done. Opaque: the server decodes it, and a cursor that
  // was not made for this repo, changeset and path is refused.
  bytes next_cursor = 7;
  reserved 3, 4, 5, 6;
  reserved "next_changeset_id", "next_path", "next_rename_searched",
      "next_rename_best";
}

message BlameRange {
  // The first line, counting from 1, in the requested file.
  uint32 start_line = 1;
  uint32 line_count = 2;
  // The changeset that last changed these lines. Empty when the call
  // stopped before it named them: the cursor says where it went on.
  bytes changeset_id = 3;
  // The first line, counting from 1, in the file at changeset_id (at its
  // BlameChangeset.path), or in the version the walk stopped at when
  // changeset_id is empty.
  uint32 origin_line = 4;
}

message BlameChangeset {
  bytes changeset_id = 1;
  bytes author_name = 2;
  bytes author_email = 3;
  int64 author_unix_secs = 4;
  int32 author_tz_offset_minutes = 5;
  // The path of the file at this changeset, where origin_line counts. It
  // differs from the requested path when the walk followed a rename. Empty
  // from a server that does not follow renames: then it is the requested
  // path.
  bytes path = 6;
}

message MergeBaseRequest {
  string repo = 1;
  bytes a_changeset_id = 2;
  bytes b_changeset_id = 3;
}

message MergeBaseResponse {
  // The best common ancestors: highest generation first, then by ID bytes,
  // lowest first. Usually one. Criss-cross merges can give several. Empty
  // when the two histories share no changeset.
  repeated bytes changeset_ids = 1;
}

message IsAncestorRequest {
  string repo = 1;
  bytes ancestor_id = 2;
  bytes descendant_id = 3;
}

message IsAncestorResponse {
  bool is_ancestor = 1;
}

message DiffRequest {
  string repo = 1;
  // `DiffEntry.old` is the state in this changeset.
  bytes old_changeset_id = 2;
  // `DiffEntry.new` is the state in this changeset.
  bytes new_changeset_id = 3;
  // Optional. Only this path: the file itself, or anything below it if it
  // is a directory. Empty means every path.
  bytes path = 4;
  // Optional. Only the paths after this one, in the order of
  // `DiffResponse.entries`. Set it to `next_after` to continue.
  bytes after = 5;
}

message DiffResponse {
  // The paths that differ, in tree order: paths compare part by part, and
  // parts by raw bytes. So `a/b` comes before `a.txt`, because the part `a`
  // comes before `a.txt`. A path that is a file on one side and a directory
  // on the other appears once for the file, then once for each file below
  // the directory.
  repeated DiffEntry entries = 1;
  // Set when the call stopped at its bound: the last path in `entries`.
  // Ask again with `after` set to it. Empty when the diff is complete.
  bytes next_after = 2;
  // Set when renames may be missing: the inexact search for renames did
  // not run (more than the pair limit of file pairs was left) or stopped
  // at its work budget. The exact renames (same content) in `entries` are
  // still whole. Every call of the same diff sets it the same way.
  bool renames_incomplete = 3;
}

message DiffEntry {
  bytes path = 1;
  // The file at `path` in the old changeset. Unset when no file is there:
  // nothing, or a directory.
  FileState old = 2;
  // The file at `path` in the new changeset. Unset as for `old`.
  FileState new = 3;
  // Set on an added file (`old` unset) that is a rename: the deleted path it
  // came from. The entry at that path has `rename_to` set to this path.
  // Empty when the file is not a rename, and from a server that does not
  // find renames.
  bytes rename_from = 4;
  // Set on a deleted file (`new` unset) that is a rename: the added path it
  // went to. The entry at that path has `rename_from` set to this path.
  bytes rename_to = 5;
  // With `rename_from` or `rename_to`: how similar the two files are, in
  // percent, as git prints it. 100 for the same content.
  uint32 similarity = 6;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_REGULAR = 1;
  FILE_KIND_SYMLINK = 2;
  FILE_KIND_GITLINK = 3;
}

// What a path holds when it is not a directory, as in a TreeV1 entry.
message FileState {
  FileKind kind = 1;
  // The blob of a regular file or of a symlink's target (32 bytes), or the
  // git commit of a gitlink (20 bytes for SHA-1, 32 for SHA-256).
  bytes id = 2;
  // Regular files only.
  bool executable = 3;
}

message GetRootTreeRequest {
  string repo = 1;
  bytes changeset_id = 2;
}

message GetRootTreeResponse {
  bytes tree_id = 1;
  // A read ticket for this tree: bound to the repo, the caller's principal
  // and this root tree, good for a short time. GetObjects takes it, and no
  // token.
  bytes ticket = 2;
}

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_TREE = 1;
  OBJECT_KIND_BLOB = 2;
}

message ObjectRef {
  ObjectKind kind = 1;
  bytes id = 2;
  // The path of the object, from the root tree of the ticket. Empty names
  // the root tree itself. A tree must be a directory entry at the path, a
  // blob the blob of a regular file or of a symlink entry there; a walk
  // never goes through a symlink, and a gitlink ends it.
  bytes path = 3;
}

// How an object's bytes travel. A tree's bytes are its TreeV1 bytes, and a
// blob's bytes are the file's content. The ID is always of those bytes.
enum Encoding {
  // The bytes as they are.
  ENCODING_RAW = 0;
  // One Zstandard frame (RFC 8878) of the bytes: not skippable, not a legacy
  // format, no dictionary, their size in the frame header, a window of at
  // most 8 MiB.
  ENCODING_ZSTD = 1;
}

message GetObjectsRequest {
  reserved 1;
  // A read ticket: permission to read the objects of one root tree of one
  // repo, for one principal, for a short time. The server gives it with
  // every GetRootTree reply.
  bytes ticket = 4;
  // 1 to 1000 objects, each with its path from that root tree.
  repeated ObjectRef refs = 2;
  // The encodings the client accepts besides RAW, which every client
  // accepts. The server sends each object RAW or in one of these.
  repeated Encoding accept = 3;
}

// One message of a GetObjects reply. An object of E encoded bytes comes in
// one or more parts of 1 byte to 1 MiB of data that add up to E, or one part
// with no data if E is 0. The first part names the object and gives its
// sizes, so a receiver can reserve memory before the rest arrives. A later
// part sets none of fields 1, 2, 4, 5 and 6.
message ObjectPart {
  // First part only.
  ObjectKind kind = 1;
  // First part only.
  bytes id = 2;
  // The next encoded bytes of the object.
  bytes data = 3;
  // First part only. RAW, or an encoding that the request accepts.
  Encoding encoding = 4;
  // First part only. E: all the encoded bytes of the object, in all its
  // parts. Equal to size for RAW.
  uint64 encoded_size = 5;
  // First part only. The size of the object's bytes, at most 100 MiB.
  uint64 size = 6;
}
