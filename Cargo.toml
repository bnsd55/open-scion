[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bnsd55/open-scion"
homepage = "https://github.com/bnsd55/open-scion"
keywords = ["vcs", "version-control", "monorepo", "git", "source-control"]
categories = ["development-tools"]
authors = ["Ben Shaharizad <bnsd55@gmail.com>"]

[workspace.dependencies]
open-scion-core = { version = "0.1.0", path = "crates/scion-core" }
open-scion-proto = { version = "0.1.0", path = "crates/scion-proto" }
open-scion-server = { version = "0.1.0", path = "crates/scion-server" }
open-scion-tier = { version = "0.1.0", path = "crates/scion-tier" }

anyhow = "1.0"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "rand_core"] }
getrandom = "0.4"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
gix = "0.89"
hashlink = "0.12"
prost = "0.14"
proptest = "1.12"
rcgen = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde_json = "1.0"
signal-hook = { version = "0.4", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
