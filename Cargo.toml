[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bnsd55/open-scion"
homepage = "https://github.com/bnsd55/open-scion"
keywords = ["vcs", "version-control", "monorepo", "git", "source-control"]
categories = ["development-tools"]
authors = ["Ben Shaharizad <bnsd55@gmail.com>"]

[workspace.dependencies]
scion-core = { path = "crates/scion-core" }
scion-proto = { path = "crates/scion-proto" }
scion-server = { path = "crates/scion-server" }

anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
gix = "0.89"
hashlink = "0.12"
prost = "0.14"
proptest = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
