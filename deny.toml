# The supply-chain check: advisories (RustSec), licenses, bans, sources.

[advisories]
version = 2
# Yanked and unmaintained releases are noted, not fatal: the finding is
# reviewed, then handled, before a denial would hide it behind an ignore.
yanked = "warn"
unmaintained = "all"

[licenses]
version = 2
# The license of this project is `MIT OR Apache-2.0` (workspace Cargo.toml).
# The list below is the license set of the dependency tree as of the first
# check; a new dependency under a different license is a change to review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
